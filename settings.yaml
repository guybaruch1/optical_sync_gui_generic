# Hand-edited settings for the RGB/IR sync POC.
#
# This is the ONE file meant to be edited by hand between runs - camera
# params and detection/test tuning all live here. Unlike config.yaml
# (which led_calibration.py overwrites wholesale every run and must never be
# hand-edited), nothing auto-rewrites this file, so comments and formatting
# are safe to rely on.

camera:
  # Per-camera-model named tests for the Stream Select picker, keyed by the
  # EXACT connected device name (rs.camera_info.name, shown as-is on Device
  # Select - e.g. "Intel RealSense D455") - different camera models support
  # genuinely different sensors/resolutions, so one shared list can't fit
  # every rig. Each camera has a LIST of named tests (e.g. "IR1 vs IR2
  # sync") - the operator picks a test first (which fixes WHICH two
  # physical streams are being compared, via stream_a_identity/
  # stream_b_identity: stream_type + stream_index, never changing across
  # sensor options), then a "sensor options" entry for it (a resolution/
  # fps/format pairing for both sides together). Each sensor_options entry
  # is intersected with whatever THAT specific connected device actually
  # reports before showing up in the picker - a hand-curated allowlist, not
  # the raw device enumeration. Some devices advertise the same real stream
  # at a given resolution/fps in many redundant pixel formats (e.g. an
  # infrared stream reported as y8 AND uyvy/bgr8/rgb8/bgra8/rgba8, which are
  # just software reinterpretations of the same monochrome data) - left
  # unfiltered, that floods the dropdown with near-identical entries and
  # buries the options that actually differ.
  #
  # stream_type is "infrared" or "color", format is any pixel format
  # domain/realsense_utils.py's DECODERS can decode (e.g. y8, bgr8, rgb8,
  # bgra8, rgba8, yuyv, uyvy, mjpeg). A test with no sensor_options entry
  # matching what the connected device actually reports is simply not
  # offered. Connecting a camera model with no entry here at all shows an
  # error asking you to add one - copy the block below as a starting
  # template.
  stream_options:
    "RealSense D455":
      - test_name: "IR1 vs IR2 sync"
        stream_a_identity: {stream_type: infrared, stream_index: 1}
        stream_b_identity: {stream_type: infrared, stream_index: 2}
        sensor_options:
          - stream_a: {width: 1280, height: 720, fps: 30, format: y8}
            stream_b: {width: 1280, height: 720, fps: 30, format: y8}
      - test_name: "IR vs RGB sync"
        stream_a_identity: {stream_type: infrared, stream_index: 1}
        stream_b_identity: {stream_type: color, stream_index: 0}
        sensor_options:
          - stream_a: {width: 1280, height: 720, fps: 30, format: y8}
            stream_b: {width: 1280, height: 720, fps: 30, format: bgr8}
    "RealSense D585 Prototype":
      - test_name: "IR1 vs IR2 sync"
        stream_a_identity: { stream_type: infrared, stream_index: 1 }
        stream_b_identity: { stream_type: infrared, stream_index: 2 }
        sensor_options:
          - stream_a: { width: 1280, height: 720, fps: 30, format: y8 }
            stream_b: { width: 1280, height: 720, fps: 30, format: y8 }
      - test_name: "IR vs RGB sync"
        stream_a_identity: { stream_type: infrared, stream_index: 1 }
        stream_b_identity: { stream_type: color, stream_index: 0 }
        sensor_options:
          - stream_a: { width: 1280, height: 720, fps: 60, format: y8 }
            stream_b: { width: 1280, height: 720, fps: 60, format: bgr8 }
          - stream_a: { width: 1280, height: 720, fps: 30, format: y8 }
            stream_b: { width: 1280, height: 720, fps: 30, format: bgr8 }
          - stream_a: { width: 1280, height: 720, fps: 15, format: y8 }
            stream_b: { width: 1280, height: 720, fps: 15, format: bgr8 }
          - stream_a: { width: 1280, height: 720, fps: 5, format: y8 }
            stream_b: { width: 1280, height: 720, fps: 5, format: bgr8 }
          - stream_a: { width: 640, height: 480, fps: 60, format: y8 }
            stream_b: { width: 640, height: 480, fps: 60, format: bgr8 }
          - stream_a: { width: 640, height: 480, fps: 30, format: y8 }
            stream_b: { width: 640, height: 480, fps: 30, format: bgr8 }
          - stream_a: { width: 640, height: 480, fps: 15, format: y8 }
            stream_b: { width: 640, height: 480, fps: 15, format: bgr8 }
          - stream_a: { width: 640, height: 480, fps: 5, format: y8 }
            stream_b: { width: 640, height: 480, fps: 5, format: bgr8 }
  # Used as the PRE-SELECTED default in the Stream Config wizard page's
  # dropdowns, if the connected camera actually reports this exact combo -
  # you can still pick a different one there if this rig/camera doesn't
  # support it (e.g. no HD@30fps on some models). Not a hard requirement.
  stream_a: {width: 1280, height: 720, fps: 30}
  stream_b: {width: 1280, height: 720, fps: 30}

  # Multi-camera hardware genlock (rs.option.inter_cam_sync_mode), keyed by
  # the EXACT connected device name - same convention as stream_options
  # above. Only ONE option exists on the SDK, but D400-series and D500-
  # series cameras use DIFFERENT raw value schemes on it (see
  # engine/streams.py's set_inter_cam_sync_mode docstring). These values
  # for "RealSense D455" are CONFIRMED via real-hardware testing
  # (tools/genlock_diag/diag_genlock_quality_test.py) - not copied from
  # public docs: matching frame counts and a tight, physically-plausible
  # ~10us-scale offset between master and slave over a 20s recording.
  # Cross-camera comparison itself is infrared-only regardless (see
  # engine/cross_camera_reconciler.py) - the slave's color sensor cannot
  # stream at all while genlocked, confirmed the same way. A camera model
  # with no entry here safely skips genlock entirely for a multi-camera
  # run (engine.streams.resolve_inter_cam_sync_value returns None) rather
  # than guessing a possibly-wrong value for an unconfirmed model/firmware -
  # do not add an entry for a camera model whose scheme hasn't been
  # confirmed on real hardware.
  inter_cam_sync:
    "RealSense D455":
      master: 1
      slave: 2

calibration:
  # Frames to let each stream settle on before treating a frame as "good".
  settle_frames: 15
  # y-gap (pixels) larger than this starts a new row when sorting detected
  # LED centroids into grid order. This is an UPPER BOUND, not a guaranteed
  # actual value: domain.realsense_utils.safe_row_gap_px caps it down at
  # run time if it's geometrically too big for this run's real measured LED
  # pixel spacing (resolution/sensor optics vary per run and per stream, so
  # a fixed constant can't be trusted to always stay below the real
  # row-to-row pitch - e.g. VGA vs HD for the same physical panel) - see
  # docs/algorithm_review_log.md's Issue 4.
  row_gap_px: 15
  # Minimum contour area (px^2) to count as a real LED blob, not noise.
  min_blob_area: 20
  # NxN pixel window averaged per LED position, for noise resilience. This
  # is an UPPER BOUND, not a guaranteed actual value: domain.realsense_utils.
  # safe_neighborhood_size caps it down at run time if it's geometrically
  # too big for this run's real measured LED pixel spacing (resolution/ROI
  # vary per run, so a fixed constant can't be trusted to always be safe) -
  # see docs/algorithm_review_log.md's Issue 1.
  neighborhood_size: 5
  # Warn if any LED's on-minus-off brightness gap is smaller than this -
  # its threshold may be unreliable.
  min_acceptable_contrast: 20

test:
  # LEDPanel.set_direction_single() mode - this project always uses 1
  # (start top-left, scan left-to-right, wrapping row to row).
  scan_direction: 1
  # Per-LED dwell time in ms. Deliberately can be set FASTER than the
  # camera's own frame interval - that's the point of pipeline_sync_test_diff.py.
  # Fractional values (e.g. 0.5) are supported end-to-end, down to 0.1ms
  # resolution (the finest step LEDPanel.set_speed_ms's own CLI call can
  # represent) - both wizard-page spinboxes accept them, not just this file.
  switch_time_ms: 1
  # Plain wall-clock capture duration - sweep-counting doesn't mean anything
  # at fast switch speeds (many sweeps per second).
  duration_s: 10.0
  num_leds: 100
  # Same UPPER BOUND caveat as calibration.neighborhood_size above - capped
  # at run time by domain.realsense_utils.safe_neighborhood_size, computed
  # independently from the same real xy_positions this run loaded, so it
  # can't silently diverge from what calibration used even though the two
  # are two separately-edited settings.yaml keys.
  neighborhood_size: 5
  # Starting default for each stream's own Threshold Tuning page spinbox -
  # both independently live-editable there while watching the live on/off
  # detection preview, before the actual test. Calibration's stored
  # threshold assumes an LED held steady for a full exposure; at fast
  # switch times only a fraction of that brightness is achievable, so the
  # runtime threshold is off + fraction*(on-off) - tune per-sensor since
  # different sensors' brightness/exposure characteristics differ.
  stream_a_threshold_fraction: 0.25
  stream_b_threshold_fraction: 0.25
  # Save a full-image on/off overlay snapshot every N frame-pairs, up to a cap.
  # Snapshot filenames use the same pair_index as the CSV's pair_index column,
  # so you can cross-check the algorithm's on/off calls against the real image.
  snapshot_every_n_pairs: 20
  max_snapshots: 15
  # Per-stream frame-drop detection: a stream's consecutive HW frame_timestamp
  # delta must exceed (1_000_000/fps) * frame_drop_threshold_factor (or be
  # negative) to be flagged as a probable dropped frame - same style of check
  # as print_frame_drops.py.
  frame_drop_threshold_factor: 1.5
  # analyze_pairing_gap's cross-stream sanity-check threshold, in
  # MICROSECONDS (stream_a_ts_us/stream_b_ts_us are HW frame_timestamp,
  # µs-scale). 100_000us is the same real-world cutoff as an old 100ms
  # default would have been.
  pairing_gap_outlier_threshold_us: 100000
  # Save a side-by-side IR/RGB debug image (same on/off overlay style as the
  # periodic LED-state snapshots above) for every pair whose position_gap_ms
  # ("Optical Sync" in the UI) magnitude is >= this many ms - lets you check
  # by eye whether a given outlier reading was a real physical desync or an
  # algorithm/detection artifact. Checked on EVERY pair (not throttled to
  # display_stride, unlike the periodic snapshots above), since most
  # individual outlier pairs wouldn't otherwise land on a displayed sample.
  # Only fires on pairs position_gap_ms did NOT already exclude for another
  # reason (frame_drop/warmup) - those already have a known cause.
  position_gap_outlier_threshold_ms: 5
  # Safety cap, same idea as max_snapshots above - a sustained real desync
  # could otherwise flag many consecutive pairs and write a very large
  # number of files / slow the capture loop with disk I/O.
  position_gap_outlier_max_snapshots: 200
  # Ignore this many frame-pairs at the START of the run when computing the
  # metrics (position gap / frame-drop stats) - everything is still captured
  # and written to the CSV (flagged via is_warmup), just excluded from the
  # stats, same as a miss/outlier/frame-drop exclusion. Covers auto-exposure
  # convergence / an initial buffered-frame burst right after the pipeline
  # starts, which can otherwise look like real drops or real gaps.
  warmup_pairs_to_skip: 15

# Inter-sensor synchronization knobs. Both target the SAME observed problem:
# on a D585 IR-vs-RGB rig, this app consistently measured a ~11.3ms gap
# between the two sensors' hardware timestamps within a single
# wait_for_frames() frameset, while a standalone reference script driving the
# identical rs.pipeline() on the same rig consistently measured ~3.5ms. Both
# numbers were stable run-to-run, so the difference is systematic, not
# startup jitter - and these two settings expose the only two structural
# differences between the app and that script, each independently
# switchable so a run can A/B one at a time.
#
# NOTE these change how the CAMERA is brought up, so they affect the very
# measurement this app exists to make - change one at a time and re-measure
# (Live Session's "HW TS Latency" is the number to watch).
camera_sync:
  # Co-enable the DEPTH stream whenever one of the two picks is infrared.
  #
  # CONFIRMED ROOT CAUSE (real-hardware finding): rs.pipeline() gives no
  # control over the order it internally OPENS the two sensors -
  # config.enable_stream() call order does NOT influence it - and that open
  # order decides whether IR and RGB come out synchronized. RGB opened
  # before IR produces a fixed multi-ms offset (this app measured ~11.3ms);
  # IR opened before RGB measures the true ~3.5ms; and enabling DEPTH
  # alongside both fixes it REGARDLESS of open order. This matches Intel's
  # documented firmware requirement that depth and IR be configured
  # together - enabling IR alone leaves the pipeline to satisfy that
  # requirement internally, in an order we can't see; enabling depth
  # explicitly removes the ambiguity. (An earlier color_stream_first knob
  # tried to fix this by reordering enable_stream() calls and, on real
  # hardware, did nothing - it was aimed at the wrong layer entirely; see
  # CLAUDE.md's "IR/RGB sync depends on stream open order" section.)
  #
  # COSTS BANDWIDTH: z16 depth at 1280x720@30 is ~55 MB/s on top of IR
  # (~28 MB/s) and bgr8 color (~83 MB/s), and on real hardware this
  # measurably increased frame drops. Turn this off if drops matter more
  # than inter-sensor sync for a given test. To claw bandwidth back while
  # keeping the fix, try a yuyv color format instead of bgr8 in
  # camera.stream_options (2 bytes/px instead of 3, ~28 MB/s saved -
  # domain/realsense_utils.py's DECODERS already handles yuyv; costs a
  # per-frame cv2 color conversion instead). No-op for a color+color
  # (Dual RGB) pairing - there's no stereo module in play to sync against.
  enable_depth_for_ir_sync: true
  # Hardware-reset the camera and wait for it to re-enumerate before each
  # Live Session run. Independent manual recovery knob, e.g. for a camera
  # left with a stuck manual exposure/gain from before
  # engine/streams.py's enable_auto_exposure was fixed to restore both on
  # switch-back to auto. Also A/B-tested (independently of the above) against
  # the ~11.3ms/~3.5ms discrepancy and, on its own, did not change the
  # result. Costs hardware_reset_settle_s of dead time on EVERY Start, so it
  # defaults off.
  hardware_reset_before_start: false
  # Seconds to wait after hardware_reset() before re-acquiring the device.
  # Too short and the device won't have re-enumerated yet and
  # find_device_by_serial will fail.
  hardware_reset_settle_s: 8.0

# Only read when the operator checks Device Select's "Use dual LED panel"
# box - two physically separate LED panels sharing one Acroname USB hub
# (only one panel's USB connection can be visible to the OS at a time) and
# one external USB relay that must stay closed (energized) for as long as
# continuous stepping is wanted - it's a gate, not a one-shot start pulse;
# releasing it freezes both panels wherever they happen to be. See
# engine/dual_panel_control.py's start_scanning/stop_scanning.
dual_panel:
  # Acroname downstream USB port number each stream's OWN panel is wired
  # to - NOT necessarily port 0 for stream_a/port 1 for stream_b; keyed
  # explicitly by stream to avoid exactly that mix-up (on this rig,
  # stream_a/IR is actually port 1 and stream_b/color is port 0).
  stream_a_panel_port: 1
  stream_b_panel_port: 0
  # Port the USB relay device itself is wired to - must be hub-enabled
  # before the relay can be triggered.
  relay_port: 6
  relay_com_port: "COM6"
  # How long to wait after switching which panel's USB port is hub-enabled
  # before sending it any command - UNVERIFIED, needs tuning on the real
  # rig. Bumped up from an initial 1s guess since a full USB re-enumeration
  # after an Acroname port switch was taking noticeably longer than that in
  # practice; keep raising this (no code change needed) if commands still
  # seem to reach a panel before it's actually ready.
  hub_switch_settle_s: 3.0

paths:
  config_path: config.yaml
  raw_csv_path: pipeline_sync_raw.csv
  frame_drop_csv_path: pipeline_sync_frame_drops.csv
  # Debug images/CSV/plots all get written under this directory.
  output_dir: output
